<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <!-- The title block lets each page set its own browser-tab title. -->
    <title>{% block title %}Simple Bank{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page">
        <!-- Simple top bar: circle logo + app name -->
        <header class="topbar">
            <a class="brand" href="{{ url_for('dashboard') }}">
                <span class="logo">SB</span>
                <div>
                    <h1>Simple Bank</h1>
                    <p class="muted">Admin dashboard</p>
                </div>
            </a>
            <a class="btn btn-ghost" href="{{ url_for('instructions') }}">Instructions</a>
        </header>

        <!-- Flash messages: success and error from Flask's flash(). -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
